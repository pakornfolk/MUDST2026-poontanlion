name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-build:
    name: Test, Build & Containerize
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Test Backend with JUnit 5
        run: |
          cd backend
          chmod +x mvnw 2>/dev/null || true
          if [ -f "./mvnw" ]; then
            ./mvnw test
          else
            mvn test
          fi

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend React Bundle
        run: |
          npm ci
          npm run build

      - name: Build Docker Compose Images
        run: |
          docker compose build
